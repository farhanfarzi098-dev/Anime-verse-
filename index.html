<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeVerse</title>
<style>
body{margin:0;background:#0b0713;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#170e27;color:#c9a5ff;font-size:26px;font-weight:bold}
main{max-width:750px;margin:auto;padding:18px}
section,.anime{background:#191126;padding:18px;border-radius:14px;margin:15px 0}
input{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:13px;border-radius:8px;border:1px solid #493364;background:#0c0814;color:white}
button{background:#8b5cf6;color:white;padding:12px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
a{color:#d4baff}
.note{color:#c4b5d7;font-size:13px}
</style>
</head>
<body>
<header>✦ AnimeVerse</header>
<main>
<h1>Your Anime Universe</h1>
<p class="note">Add anime episodes using links you are authorized to share.</p>

<section>
<h2>Add Anime Episode</h2>
<form id="animeForm">
<input id="name" placeholder="Anime name" required>
<input id="episode" placeholder="Episode number or title" required>
<input id="url" type="url" placeholder="Authorized video or streaming URL" required>
<button type="submit">＋ Add Episode</button>
</form>
<p class="note">This demo saves entries only in this browser. It does not upload video files.</p>
</section>

<input id="search" placeholder="Search anime...">
<div id="list"></div>
</main>

<script>
const form=document.getElementById('animeForm');
const list=document.getElementById('list');
const search=document.getElementById('search');
let anime=[];

function render(){
  list.replaceChildren();
  anime.filter(a=>(a.name+' '+a.episode).toLowerCase()
    .includes(search.value.toLowerCase())).forEach(a=>{
    const card=document.createElement('article');
    card.className='anime';
    const title=document.createElement('h2');
    title.textContent=a.name;
    const episode=document.createElement('p');
    episode.textContent=a.episode;
    const link=document.createElement('a');
    link.href=a.url;
    link.target='_blank';
    link.rel='noopener noreferrer';
    link.textContent='▶ Watch Episode';
    card.append(title,episode,link);
    list.append(card);
  });
}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('name').value.trim();
  const episode=document.getElementById('episode').value.trim();
  const url=document.getElementById('url').value.trim();
  try{
    const parsed=new URL(url);
    if(!['https:','http:'].includes(parsed.protocol)) throw Error();
  }catch{
    alert('Enter a valid web link.');
    return;
  }
  anime.unshift({name,episode,url});
  form.reset();
  render();
});
search.addEventListener('input',render);<div class="card">
  <h3>My Anime</h3>
  <p>Episode 1</p>
  <a href="https://YOUR-AUTHORIZED-VIDEO-LINK"
     target="_blank" rel="noopener noreferrer">
    ▶ Watch Episode
  </a>
</div>
render();
</script>
</body>
</html>
